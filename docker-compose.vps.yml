# Compose de produção para a VPS Hostinger (Traefik já roda em modo host e emite o HTTPS).
# Variáveis APP_PASSWORD e ANTHROPIC_API_KEY são definidas no projeto Docker (hPanel), nunca no repo.
services:
  workout:
    build: https://github.com/erondmx/workout-coach.git#main
    restart: unless-stopped
    environment:
      - APP_PASSWORD=${APP_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TZ_APP=America/Sao_Paulo
    volumes:
      - workout_data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.treino.rule=Host(`treino.teamever.tech`)
      - traefik.http.routers.treino.entrypoints=websecure
      - traefik.http.routers.treino.tls.certresolver=letsencrypt
      - traefik.http.services.treino.loadbalancer.server.port=3000

volumes:
  workout_data:
