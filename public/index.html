<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FitBurn Coach</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FitBurn">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icon-180.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color:#0f172a; color:#f8fafc; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
        .set-btn.completed { background-color:#10b981; border-color:#10b981; color:#fff; }
        .tab-btn.active { background-color:#f97316; color:#fff; border-color:#f97316; }
        .safe-top { padding-top: max(1.25rem, env(safe-area-inset-top)); }
        .safe-bottom { padding-bottom: max(0.75rem, env(safe-area-inset-bottom)); }
        input, textarea { font-size:16px; } /* evita zoom automático no iOS */
        .bubble { white-space:pre-wrap; word-break:break-word; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen bg-slate-900">

<!-- Login -->
<div id="login" class="hidden fixed inset-0 z-50 bg-slate-900 flex items-center justify-center p-6">
    <form id="login-form" class="w-full max-w-xs space-y-3">
        <h1 class="text-2xl font-bold text-orange-500 text-center"><i class="fa-solid fa-fire-flame-curved"></i> FitBurn Coach</h1>
        <input id="login-pass" type="password" autocomplete="current-password" placeholder="Senha"
               class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:border-orange-500">
        <p id="login-err" class="text-sm text-red-400 min-h-[1.25rem]"></p>
        <button class="w-full bg-orange-500 hover:bg-orange-600 font-bold rounded-xl py-3">Entrar</button>
    </form>
</div>

<!-- Header -->
<header class="safe-top px-5 pb-4 bg-slate-800 border-b border-slate-700 sticky top-0 z-20">
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-orange-500 flex items-center gap-2">
                <i class="fa-solid fa-fire-flame-curved"></i> FitBurn Coach
            </h1>
            <p class="text-xs text-slate-400">Emagrecimento &amp; Definição</p>
        </div>
        <div class="flex gap-2">
            <button id="coach-open" class="text-xs bg-orange-500 hover:bg-orange-600 transition px-3 py-1.5 rounded-lg text-white font-semibold flex items-center gap-1">
                <i class="fa-solid fa-comment-dots"></i> Coach
            </button>
            <button id="reset-btn" class="text-xs bg-slate-700 hover:bg-red-600 transition px-3 py-1.5 rounded-lg text-slate-300" aria-label="Resetar dia">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </div>

    <div class="mt-4">
        <div class="flex justify-between text-xs mb-1">
            <span class="text-slate-400">Progresso do Treino</span>
            <span id="progress-text" class="font-bold text-emerald-400">0%</span>
        </div>
        <div class="w-full bg-slate-700 rounded-full h-2.5">
            <div id="progress-bar" class="bg-emerald-500 h-2.5 rounded-full transition-all duration-300" style="width:0%"></div>
        </div>
    </div>

    <div class="grid grid-cols-3 gap-2 mt-4">
        <button data-day="A" class="tab-btn py-2 px-3 rounded-lg text-sm font-semibold border border-slate-600 bg-slate-700/50 transition">Dia 1 (A)</button>
        <button data-day="B" class="tab-btn py-2 px-3 rounded-lg text-sm font-semibold border border-slate-600 bg-slate-700/50 transition">Dia 2 (B)</button>
        <button data-day="C" class="tab-btn py-2 px-3 rounded-lg text-sm font-semibold border border-slate-600 bg-slate-700/50 transition">Dia 3 (C)</button>
    </div>
</header>

<main class="p-4 pb-40">
    <div class="mb-4 bg-orange-500/10 border border-orange-500/30 rounded-xl p-3">
        <h2 id="day-title" class="font-bold text-orange-400 text-sm"></h2>
        <p id="day-desc" class="text-xs text-slate-300 mt-0.5"></p>
    </div>
    <div id="workout-list" class="space-y-3"></div>
    <button id="logout-btn" class="mt-6 text-xs text-slate-500 underline mx-auto block">Sair</button>
</main>

<!-- Cronômetro -->
<footer class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-800 border-t border-slate-700 px-3 pt-3 safe-bottom z-30 shadow-lg">
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div id="timer-display" class="text-2xl font-mono font-bold text-white bg-slate-900 px-3 py-1 rounded-lg border border-slate-700 w-24 text-center">00:45</div>
            <div class="flex flex-col gap-1">
                <span class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Descanso</span>
                <div class="flex gap-1">
                    <button data-rest="45" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-slate-200">45s</button>
                    <button data-rest="60" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-slate-200">60s</button>
                    <button data-rest="90" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-0.5 rounded text-slate-200">90s</button>
                </div>
            </div>
        </div>
        <button id="timer-btn" class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-4 py-2 rounded-xl text-sm transition flex items-center gap-1 shadow-md">
            <i class="fa-solid fa-play" id="timer-icon"></i> <span id="timer-btn-text">Iniciar</span>
        </button>
    </div>
</footer>

<!-- Coach -->
<div id="coach" class="hidden fixed inset-0 z-40 bg-slate-900 max-w-md mx-auto flex flex-col">
    <div class="safe-top px-4 pb-3 bg-slate-800 border-b border-slate-700 flex items-center justify-between">
        <h2 class="font-bold text-orange-400"><i class="fa-solid fa-dumbbell mr-1"></i> Seu Coach</h2>
        <div class="flex gap-3 items-center">
            <button id="undo-btn" class="hidden text-xs text-slate-300 underline">Desfazer último ajuste</button>
            <button id="coach-close" class="text-slate-300 text-lg px-2" aria-label="Fechar"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>
    <div id="chat" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
    <form id="chat-form" class="safe-bottom px-3 pt-2 bg-slate-800 border-t border-slate-700">
        <div id="photo-strip" class="hidden flex gap-2 mb-2 overflow-x-auto"></div>
        <div class="flex gap-2 items-end">
            <input id="photo-input" type="file" accept="image/*" multiple class="hidden">
            <button type="button" id="photo-btn" class="bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl px-3 py-3 mb-0.5" aria-label="Anexar foto do aparelho"><i class="fa-solid fa-camera"></i></button>
            <textarea id="chat-input" rows="2" placeholder="Ex.: não achei o leg press, esse aqui serve? (anexe fotos)"
                      class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 resize-none focus:outline-none focus:border-orange-500"></textarea>
            <button id="chat-send" class="bg-orange-500 hover:bg-orange-600 text-white rounded-xl px-4 py-3 mb-0.5" aria-label="Enviar"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
        <p class="text-[10px] text-slate-500 mt-1 pb-1">As fotos vão para a IA e não ficam salvas. Evite mostrar rostos.</p>
    </form>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let S = { plan: {}, weights: {}, hints: {}, assess: {}, progress: { sets: {}, setReps: {}, setWeights: {}, day: 'A' }, chat: [], canUndo: false, coachEnabled: false };
let day = 'A';

// ---------- API ----------
async function api(method, url, body) {
    const res = await fetch(url, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined,
        credentials: 'same-origin',
    });
    if (res.status === 401 && url !== '/api/login') { showLogin(); throw new Error('auth'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `Erro ${res.status}`);
    return data;
}

const progressPayload = () => ({ sets: S.progress.sets, weights: S.weights, setReps: S.progress.setReps, setWeights: S.progress.setWeights, day });

let saveTimer = null;
function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
        api('PUT', '/api/state', progressPayload()).then((r) => { if (r.assess) { S.assess = r.assess; refreshAssess(); } }).catch(() => {});
    }, 400);
}

// ---------- login ----------
function showLogin() { $('#login').classList.remove('hidden'); $('#login-pass').focus(); }
$('#login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('#login-err').textContent = '';
    try {
        await api('POST', '/api/login', { password: $('#login-pass').value });
        $('#login-pass').value = '';
        $('#login').classList.add('hidden');
        await load();
    } catch (err) { $('#login-err').textContent = err.message; }
});
$('#logout-btn').addEventListener('click', async () => { await api('POST', '/api/logout').catch(() => {}); location.reload(); });

async function load() {
    S = await api('GET', '/api/state');
    day = S.progress.day || 'A';
    switchDay(day);
    renderChat();
}

// ---------- treino ----------
function switchDay(d) {
    day = d;
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.day === d));
    const p = S.plan[d];
    $('#day-title').textContent = p.title;
    $('#day-desc').textContent = p.desc;
    render();
    scheduleSave();
}
document.querySelectorAll('.tab-btn').forEach((b) => b.addEventListener('click', () => switchDay(b.dataset.day)));

function restSecs(ex) { return ex.rest ? parseInt(ex.rest, 10) : 45; }

const HINT_STYLE = {
    up: ['bg-emerald-500/10 border-emerald-500/40 text-emerald-300', 'fa-arrow-trend-up'],
    down: ['bg-amber-500/10 border-amber-500/40 text-amber-300', 'fa-arrow-trend-down'],
    hold: ['bg-slate-700/40 border-slate-600 text-slate-300', 'fa-equals'],
    reps: ['bg-blue-500/10 border-blue-500/40 text-blue-300', 'fa-repeat'],
};
function hintHtml(ex, w) {
    const h = !ex.isCardio && S.hints && S.hints[ex.id];
    if (!h) return '';
    const [cls, icon] = HINT_STYLE[h.type] || HINT_STYLE.hold;
    const canApply = (h.type === 'up' || h.type === 'down') && Number(w) !== h.to;
    return `<div class="mt-3 text-xs border rounded-lg px-3 py-2 flex items-start justify-between gap-2 ${cls}">
        <span><i class="fa-solid ${icon} mr-1"></i>${esc(h.text)}</span>
        ${canApply ? `<button data-apply="${esc(ex.id)}" data-to="${h.to}" class="shrink-0 bg-white/10 hover:bg-white/20 rounded-md px-2 py-1 font-bold">Aplicar</button>` : ''}
    </div>`;
}
const kg = (n) => String(n).replace('.', ',') + ' kg';
const SIGNAL = {
    up: { cls: 'bg-emerald-500/15 border-emerald-500/50 text-emerald-300', icon: 'fa-arrow-up' },
    hold: { cls: 'bg-amber-500/10 border-amber-500/40 text-amber-300', icon: 'fa-equals' },
    down: { cls: 'bg-red-500/10 border-red-500/50 text-red-300', icon: 'fa-arrow-down' },
};
function assessHtml(ex) {
    const a = S.assess && S.assess[ex.id];
    if (!a) return '<span class="text-slate-500">Anote as reps de cada série para o app avaliar a carga.</span>';
    const sig = SIGNAL[a.action] || SIGNAL.hold;
    let label;
    if (a.level === 'pending') label = 'Anote as reps da nova carga';
    else if (a.action === 'up') label = a.partial ? `Dá para subir já para ${kg(a.to)}` : `Subir para ${kg(a.to)}`;
    else if (a.action === 'down') label = `Reduzir para ${kg(a.to)}`;
    else label = a.weight ? `Manter ${kg(a.weight)}` : 'Manter a carga';
    const canApply = a.to && Number(S.weights[ex.id]) !== a.to && (a.action === 'up' || a.action === 'down');
    return `<span class="block border rounded-lg px-3 py-2 ${sig.cls}">
        <span class="flex items-center justify-between gap-2 font-bold"><span><i class="fa-solid ${sig.icon} mr-1"></i>${esc(label)}</span>
        ${canApply ? `<button type="button" data-apply="${esc(ex.id)}" data-to="${a.to}" class="shrink-0 bg-white/10 hover:bg-white/20 rounded-md px-2 py-1 text-xs">Aplicar</button>` : ''}</span>
        <span class="block font-normal mt-1 text-slate-300">${esc(a.text)}</span></span>`;
}
function feedbackHtml(ex, done) {
    const nums = String(ex.reps).match(/\d+/g) || [];
    const top = nums.length > 1 ? nums[1] : (nums[0] || '');
    const inputs = [...done].sort((x, y) => x - y).map((s) => {
        const v = (S.progress.setReps[ex.id] || {})[s];
        return `<label class="flex flex-col items-center gap-0.5"><span class="text-[10px] text-slate-500">${s}ª${(S.progress.setWeights[ex.id] || {})[s] ? ' · ' + kg(S.progress.setWeights[ex.id][s]) : ''}</span>
            <input type="number" inputmode="numeric" placeholder="${top}" value="${v ?? ''}" data-setreps="${esc(ex.id)}" data-set="${s}"
                class="w-12 bg-slate-900 border border-slate-700 rounded-lg px-1 py-1 text-center font-bold text-sky-300 focus:outline-none focus:border-sky-500"></label>`;
    }).join('');
    return `<div class="mt-3 pt-3 border-t border-slate-700/60">
        <div class="text-xs text-slate-400 mb-2">Reps feitas em cada série</div>
        <div class="flex gap-2 flex-wrap">${inputs}</div>
        <p data-assess="${esc(ex.id)}" class="text-xs mt-2">${assessHtml(ex)}</p>
    </div>`;
}
function refreshAssess() {
    document.querySelectorAll('[data-assess]').forEach((p) => {
        const ex = S.plan[day].exercises.find((x) => x.id === p.dataset.assess);
        if (ex) p.innerHTML = assessHtml(ex);
    });
}

function render() {
    const list = $('#workout-list');
    list.innerHTML = '';
    let n = 0;
    S.plan[day].exercises.forEach((ex) => {
        const done = S.progress.sets[ex.id] || [];
        const all = done.length === ex.sets;
        let setsHtml = '';
        if (ex.isCardio) {
            const ok = done.includes(1);
            setsHtml = `<button data-ex="${esc(ex.id)}" data-set="1" class="set-btn ${ok ? 'completed' : 'bg-slate-700 text-slate-300 border-slate-600'} border rounded-lg h-9 px-4 font-bold text-xs transition">${ok ? '<i class="fa-solid fa-check"></i> Feito' : 'Concluir'}</button>`;
        } else {
            for (let s = 1; s <= ex.sets; s++) {
                const ok = done.includes(s);
                setsHtml += `<button data-ex="${esc(ex.id)}" data-set="${s}" class="set-btn ${ok ? 'completed' : 'bg-slate-700 text-slate-300 border-slate-600'} border rounded-lg h-9 w-9 font-bold text-xs transition">${ok ? '<i class="fa-solid fa-check"></i>' : s + 'ª'}</button>`;
            }
        }
        if (!ex.isCardio) n++;
        const w = S.weights[ex.id];
        const card = document.createElement('div');
        card.className = `p-4 rounded-xl border transition ${all ? 'bg-slate-800/40 border-emerald-500/40' : 'bg-slate-800 border-slate-700'}`;
        card.innerHTML = `
            <div class="flex justify-between items-start gap-2">
                <div>
                    <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded ${ex.isCardio ? 'bg-orange-500/20 text-orange-400' : 'bg-blue-500/20 text-blue-400'}">${ex.isCardio ? 'Cardio / Metabólico' : 'Exercício ' + n}</span>
                    <h3 class="font-bold text-base mt-1 ${all ? 'line-through text-slate-400' : 'text-white'}">${esc(ex.name)}</h3>
                    ${ex.swappedFrom ? `<p class="text-[11px] text-sky-300 mt-0.5"><i class="fa-solid fa-arrows-rotate mr-1"></i>Hoje, no lugar de: ${esc(ex.swappedFrom)}</p>` : ''}
                    <p class="text-xs text-slate-400 mt-0.5">
                        ${ex.isCardio ? esc(ex.reps) : `<i class="fa-solid fa-repeat mr-1"></i> ${ex.sets}x de ${esc(ex.reps)}`}
                        ${ex.rest ? `<span class="ml-2"><i class="fa-regular fa-clock mr-1"></i>${esc(ex.rest)}</span>` : ''}
                    </p>
                </div>
                ${ex.isCardio ? '' : `
                <div class="flex flex-col items-end">
                    <label class="text-[10px] text-slate-400 mb-0.5">Carga (kg)</label>
                    <input type="number" inputmode="decimal" placeholder="0" value="${w ?? ''}" data-weight="${esc(ex.id)}"
                        class="w-16 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-center font-bold text-orange-400 focus:outline-none focus:border-orange-500">
                </div>`}
            </div>
            ${hintHtml(ex, w)}
            <div class="mt-3 pt-3 border-t border-slate-700/60 flex items-center justify-between">
                <span class="text-xs text-slate-400">${ex.isCardio ? 'Status:' : 'Marcar séries:'}</span>
                <div class="flex gap-2">${setsHtml}</div>
            </div>
            ${!ex.isCardio && done.length ? feedbackHtml(ex, done) : ''}
            ${ex.isCardio ? '' : `<button data-nofind="${esc(ex.id)}" class="mt-3 text-[11px] text-slate-400 underline"><i class="fa-solid fa-camera mr-1"></i>Não achei o aparelho</button>`}`;
        list.appendChild(card);
    });
    updateProgress();
}

$('#workout-list').addEventListener('click', (e) => {
    const nf = e.target.closest('[data-nofind]');
    if (nf) {
        const ex = S.plan[day].exercises.find((x) => x.id === nf.dataset.nofind);
        $('#coach').classList.remove('hidden');
        renderChat();
        const input = $('#chat-input');
        input.value = `Não achei o aparelho de "${ex.name}" (exercício ${ex.swappedFrom ? ex.id.slice(0, -1) : ex.id}). Vou mandar foto(s) do que tem aqui. Serve para trocar hoje?`;
        input.focus();
        return;
    }
    const ap = e.target.closest('[data-apply]');
    if (ap) { S.weights[ap.dataset.apply] = Number(ap.dataset.to); scheduleSave(); render(); return; }
    const b = e.target.closest('.set-btn');
    if (!b) return;
    unlockAudio();
    const id = b.dataset.ex, s = Number(b.dataset.set);
    const ex = S.plan[day].exercises.find((x) => x.id === id);
    const arr = (S.progress.sets[id] ||= []);
    const i = arr.indexOf(s);
    if (i > -1) {
        arr.splice(i, 1);
        if (S.progress.setReps[id]) delete S.progress.setReps[id][s];
        if (S.progress.setWeights[id]) delete S.progress.setWeights[id][s];
    } else {
        arr.push(s);
        const cur = Number(S.weights[id]);
        if (cur > 0) (S.progress.setWeights[id] ||= {})[s] = cur; // carga desta série = a que está no campo agora
        if (!ex.isCardio) { setTimer(restSecs(ex)); startTimer(); }
    }
    scheduleSave();
    render();
});

$('#workout-list').addEventListener('input', (e) => {
    const rid = e.target.dataset.setreps;
    if (rid) {
        const bag = (S.progress.setReps[rid] ||= {});
        if (e.target.value === '') delete bag[e.target.dataset.set]; else bag[e.target.dataset.set] = Number(e.target.value);
        scheduleSave();
        return;
    }
    const id = e.target.dataset.weight;
    if (!id) return;
    if (e.target.value === '') delete S.weights[id]; else S.weights[id] = Number(e.target.value);
    scheduleSave();
});

function updateProgress() {
    let total = 0, done = 0;
    S.plan[day].exercises.forEach((ex) => { total += ex.sets; done += (S.progress.sets[ex.id] || []).length; });
    const pct = total ? Math.round((done / total) * 100) : 0;
    $('#progress-bar').style.width = pct + '%';
    $('#progress-text').textContent = pct + '%';
}

$('#reset-btn').addEventListener('click', async () => {
    if (!confirm('Desmarcar todas as séries de hoje? (As cargas são mantidas)')) return;
    S = await api('POST', '/api/reset-day');
    render();
});

// ---------- cronômetro (baseado em horário, resiste a aba em segundo plano) ----------
let restTotal = 45, remaining = 45, endAt = 0, tick = null, wakeLock = null, audioCtx = null;

function unlockAudio() {
    try {
        audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch {}
}
function beep() {
    try {
        if (!audioCtx) return;
        [0, 0.25, 0.5].forEach((t) => {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
            const at = audioCtx.currentTime + t;
            g.gain.setValueAtTime(0.25, at); g.gain.exponentialRampToValueAtTime(0.001, at + 0.18);
            o.start(at); o.stop(at + 0.2);
        });
    } catch {}
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
}
function showTime() {
    const m = String(Math.floor(remaining / 60)).padStart(2, '0'), s = String(remaining % 60).padStart(2, '0');
    const d = $('#timer-display');
    d.textContent = `${m}:${s}`;
    d.classList.remove('text-emerald-400', 'animate-pulse');
}
function setTimer(sec) { stopTimer(); restTotal = sec; remaining = sec; showTime(); }
function startTimer() {
    if (tick) return;
    endAt = Date.now() + remaining * 1000;
    $('#timer-icon').className = 'fa-solid fa-pause';
    $('#timer-btn-text').textContent = 'Pausar';
    if (navigator.wakeLock) navigator.wakeLock.request('screen').then((l) => (wakeLock = l)).catch(() => {});
    tick = setInterval(() => {
        remaining = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
        showTime();
        if (remaining <= 0) {
            stopTimer(); remaining = restTotal; beep();
            const d = $('#timer-display'); d.textContent = 'BORA!'; d.classList.add('text-emerald-400', 'animate-pulse');
        }
    }, 250);
}
function stopTimer() {
    clearInterval(tick); tick = null;
    $('#timer-icon').className = 'fa-solid fa-play';
    $('#timer-btn-text').textContent = 'Iniciar';
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}
$('#timer-btn').addEventListener('click', () => { unlockAudio(); if (tick) { remaining = Math.max(0, Math.ceil((endAt - Date.now()) / 1000)); stopTimer(); showTime(); } else { if (remaining <= 0) remaining = restTotal; showTime(); startTimer(); } });
document.querySelectorAll('[data-rest]').forEach((b) => b.addEventListener('click', () => setTimer(Number(b.dataset.rest))));

// ---------- coach ----------
function renderChat() {
    const box = $('#chat');
    if (!S.chat.length) {
        box.innerHTML = `<div class="text-sm text-slate-400 text-center mt-6 px-4">Conte o que você fez, o que sentiu ou o que não deu para fazer.<br>O coach ajusta seu treino automaticamente.${S.coachEnabled ? '' : '<br><br><span class="text-red-400">Coach desativado: falta OPENROUTER_API_KEY no servidor.</span>'}</div>`;
    } else {
        box.innerHTML = S.chat.map((m) => `
            <div class="flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}">
                <div class="bubble max-w-[85%] rounded-2xl px-3 py-2 text-sm ${m.role === 'user' ? 'bg-orange-500 text-white' : 'bg-slate-800 border border-slate-700 text-slate-100'}">${m.photos ? `<div class="text-[11px] opacity-80 mb-1"><i class="fa-solid fa-camera"></i> ${m.photos} foto(s)</div>` : ''}${esc(m.text)}${m.swapped && m.swapped.length ? `<div class="mt-1 text-[11px] text-sky-300"><i class="fa-solid fa-arrows-rotate"></i> Só hoje: ${esc(m.swapped.join(', '))}</div>` : ''}${m.changed && m.changed.length ? `<div class="mt-1 text-[11px] text-emerald-400"><i class="fa-solid fa-wand-magic-sparkles"></i> Treino ${m.changed.join(', ')} atualizado</div>` : ''}</div>
            </div>`).join('');
    }
    $('#undo-btn').classList.toggle('hidden', !S.canUndo);
    box.scrollTop = box.scrollHeight;
}
$('#coach-open').addEventListener('click', () => { $('#coach').classList.remove('hidden'); renderChat(); });
$('#coach-close').addEventListener('click', () => $('#coach').classList.add('hidden'));

let photos = []; // data URLs JPEG já reduzidas
function renderPhotos() {
    const strip = $('#photo-strip');
    strip.classList.toggle('hidden', !photos.length);
    strip.innerHTML = photos.map((u, i) => `<div class="relative shrink-0"><img src="${u}" class="h-16 w-16 object-cover rounded-lg border border-slate-600"><button type="button" data-rmphoto="${i}" class="absolute -top-1 -right-1 bg-slate-900 border border-slate-600 rounded-full w-5 h-5 text-[10px]" aria-label="Remover foto">×</button></div>`).join('');
}
function shrink(file, max = 1024) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            const k = Math.min(1, max / Math.max(img.width, img.height));
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            URL.revokeObjectURL(url);
            resolve(c.toDataURL('image/jpeg', 0.7));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('não consegui ler a foto')); };
        img.src = url;
    });
}
$('#photo-btn').addEventListener('click', () => $('#photo-input').click());
$('#photo-input').addEventListener('change', async (e) => {
    for (const f of [...e.target.files]) {
        if (photos.length >= 4) break;
        try { photos.push(await shrink(f)); } catch (err) { alert(err.message); }
    }
    e.target.value = '';
    renderPhotos();
});
$('#photo-strip').addEventListener('click', (e) => {
    const b = e.target.closest('[data-rmphoto]');
    if (b) { photos.splice(Number(b.dataset.rmphoto), 1); renderPhotos(); }
});

$('#chat-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = $('#chat-input'), text = input.value.trim();
    if (!text && !photos.length) return;
    const sending = photos;
    photos = []; renderPhotos();
    input.value = '';
    S.chat.push({ role: 'user', text: text || 'Veja as fotos.', photos: sending.length });
    S.chat.push({ role: 'assistant', text: '…' });
    renderChat();
    $('#chat-send').disabled = true;
    try {
        await api('PUT', '/api/state', progressPayload()); // coach vê o que você acabou de marcar
        const r = await api('POST', '/api/coach', { message: text, images: sending });
        S = r.state;
        if (r.changed.length) day = r.changed[0];
        switchDay(day);
    } catch (err) {
        S.chat.pop();
        S.chat.push({ role: 'assistant', text: `⚠️ ${err.message}` });
    } finally {
        $('#chat-send').disabled = false;
        renderChat();
    }
});
$('#undo-btn').addEventListener('click', async () => {
    if (!confirm('Desfazer o último ajuste do coach?')) return;
    S = await api('POST', '/api/plan/undo');
    switchDay(day);
    renderChat();
});

// ---------- init ----------
load().catch(() => {});
</script>
</body>
</html>
